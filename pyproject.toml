[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-vs-local-5090-bench"
version = "0.1.0"
description = "Streaming TTFA, RTF, and mid-utterance barge-in cancel latency benchmark comparing Cartesia Sonic v5 WebSockets against local RTX 5090 TTS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
live = ["cartesia>=2.0.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
